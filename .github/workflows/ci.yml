name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    # The suite runs against a real Postgres (see discussions/02-postgres-persistence.md),
    # so CI needs one too. Without it — and without DATABASE_URL — even `pnpm install`
    # fails: its postinstall runs `prisma generate`, and prisma.config.ts refuses to load
    # with the variable unset.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: turtleauth
          POSTGRES_USER: turtleauth
          POSTGRES_PASSWORD: turtleauth
        ports:
          - 5432:5432
        # Wait for "ready to accept connections", not just "container started".
        options: >-
          --health-cmd "pg_isready -U turtleauth -d turtleauth"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://turtleauth:turtleauth@localhost:5432/turtleauth?schema=public
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm exec prisma migrate deploy

      - run: pnpm test
